<div class="container">
  <h1>{{ title() }}</h1>
  
  <div class="actions">
    <button (click)="showAddForm()" class="btn-add">+ Add Record</button>
  </div>
  
  @if (showForm) {
    <div class="form-container">
      <h3>Add New Record</h3>
      <form (ngSubmit)="addRecord()">
        <div class="form-group">
          <label>Date:</label>
          <input type="date" [(ngModel)]="newRecord.Date" name="Date" placeholder="e.g., 2/8/2025" required>
        </div>
        <div class="form-group">
          <label>Reason:</label>
          <input type="text" [(ngModel)]="newRecord.Reason" name="Reason" placeholder="e.g., tractor la dile" required>
        </div>
        <div class="form-group">
          <label>Rs.:</label>
          <input type="text" [(ngModel)]="newRecord.Rs" name="Rs" placeholder="e.g., 8100" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit">Save</button>
          <button type="button" (click)="showAddForm()" class="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  }
  
  @if (homeConstructionData && homeConstructionData.length > 0) {
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Reason</th>
          <th>Rs.</th>
        </tr>
      </thead>
      <tbody>
        @for (item of homeConstructionData; track $index) {
          <tr>
            <td>{{ item.Date }}</td>
            <td>{{ item.Reason }}</td>
            <td>{{ item.Rs }}</td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p>No data available</p>
  }
</div>
